<!DOCTYPE html>
<html>
<head>
  <title>AdityaGram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  body { font-family: 'Segoe UI', Arial; background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); margin:0; min-height:100vh; }
  h2 { text-align:center; color:white; padding:20px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); font-size:28px; }
  .post-box { background: white; max-width:500px; margin:20px auto; padding:20px; border-radius:15px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
  .post-box input, .post-box button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box; }
  .post-box button { background: linear-gradient(45deg, #fa7e1e, #d62976); color:white; border:none; font-weight:bold; cursor:pointer; font-size:16px; }
  .post-box button:hover { opacity:0.9; }
  .post { background: white; max-width:500px; margin:20px auto; border-radius:15px; overflow:hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
  .post img { width: 100%; display:block; }
  .post-info { padding: 12px 15px; font-weight:500; }
</style>
</head>
<body>
  <h2>AdityaGram 📸</h2>

  <div class="post-box">
    <h3>Naya Post</h3>
    <input type="text" id="caption" placeholder="Caption likho...">
    <input type="file" id="image">
    <button onclick="uploadPost()">Post Karo</button>
  </div>

  <div id="feed"></div>

<script>
  async function loadPosts() {
    const res = await fetch('/api/posts');
    const posts = await res.json();
    document.getElementById('feed').innerHTML = posts.map(p => `
      <div class="post">
        <img src="${p.imageUrl}">
        <div class="post-info">
          <b>${p.username}</b> - ${p.caption}
          <br>
          <button onclick="likePost('${p._id}')">❤️ ${p.likes} Likes</button>
        </div>
      </div>
    `).join('');
  }

  async function uploadPost() {
    const caption = document.getElementById('caption').value;
    const image = document.getElementById('image').files[0];
    if (!image) return alert('Photo select karo');

    const formData = new FormData();
    formData.append('caption', caption);
    formData.append('image', image);
    formData.append('username', 'aditya');

    await fetch('/api/posts', { method: 'POST', body: formData });
    alert('Post ho gaya!');
    loadPosts();
  }

  async function likePost(id) {
    await fetch('/api/posts/' + id + '/like', { method: 'POST' });
    loadPosts();
  }

  loadPosts();
</script>
</body>
</html>
